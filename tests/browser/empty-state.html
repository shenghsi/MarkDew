<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Empty state layout check</title>
<div id="app"></div>
<pre id="result">running</pre>
<script type="module">
import '/src/web/main.ts';
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
await wait(800);
document.querySelector('#close-document').click();
await wait(800);
const box = el => { const r = el.getBoundingClientRect(); return {x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height)}; };
const panel = document.querySelector('#empty-document'), ws = document.querySelector('.workspace');
const kids = Array.from(ws.children).map(el => ({tag: el.tagName + (el.id ? '#' + el.id : ''), hidden: el.hidden, display: getComputedStyle(el).display, box: box(el)}));
const heading = box(panel.querySelector('h2')), actions = box(panel.querySelector('.empty-document-actions')), area = box(ws);
const ok = getComputedStyle(document.querySelector('#editor')).display === 'none' &&
  Math.abs(heading.x + heading.w / 2 - (area.x + area.w / 2)) < 2 &&
  Math.abs((heading.y + actions.y + actions.h) / 2 - (area.y + area.h / 2)) < 4;
document.querySelector('#result').textContent = JSON.stringify({
  ok, noDocument: document.body.classList.contains('no-document'), win: [innerWidth, innerHeight], workspace: box(ws), panel: box(panel),
  h2: box(panel.querySelector('h2')), buttons: box(panel.querySelector('.empty-document-actions')), kids}, null, 1);
</script>
</html>
