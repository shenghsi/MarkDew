<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Image paste check</title>
<div id="app"></div>
<pre id="result">running</pre>
<script type="module">
import '/src/web/main.ts';
import { collapseDataUris } from '/src/web/data-uri-collapse.ts';
import { setEditorActive } from '/src/web/preview.ts';
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
await wait(800);
const png = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aDLsAAAAASUVORK5CYII='), c => c.charCodeAt(0));
const view = window.view; view.dispatch({ changes: { from: 0, insert: 'Hello' }, selection: { anchor: 5 } });
view.contentDOM.focus(); await wait(100);
const out = {};
const paste = async label => {
  const data = new DataTransfer(); data.items.add(new File([png], 'shot.png', { type: 'image/png' }));
  const event = new ClipboardEvent('paste', { clipboardData: data, bubbles: true, cancelable: true });
  const notCancelled = view.contentDOM.dispatchEvent(event);
  await wait(600);
  out[label] = { prevented: !notCancelled, doc: view.state.doc.toString().slice(0, 80), status: document.querySelector('#status').textContent };
};
await paste('paste1');
view.dispatch({ changes: { from: view.state.doc.length, insert: '\n\n![](<data:image/png;base64,' + 'A'.repeat(30000) + '>)' } }); await wait(400);
view.dispatch({ selection: { anchor: view.state.doc.length - 3 }, effects: setEditorActive.of(true) }); await wait(600);
out.collapsed = Array.from(document.querySelectorAll('.cm-data-collapsed')).map(el => el.textContent);
const plugin = view.plugin(collapseDataUris);
out.debug = { plugin: !!plugin, decorations: plugin ? plugin.decorations.size : -1, len: view.state.doc.length, viewport: [view.viewport.from, view.viewport.to], visible: view.visibleRanges.map(r => [r.from, r.to]), lines: view.state.doc.lines, hasClass: !!document.querySelector('.cm-data-collapsed') };
out.visibleText = view.contentDOM.textContent.slice(0, 120);
out.ok = out.paste1.prevented && out.paste1.doc.includes('data:image/png;base64,') && out.collapsed.length === 1 && out.collapsed[0] === 'image data · 22 KB' && !view.contentDOM.textContent.includes('AAAAAAAAAAAAAAAA');
document.querySelector('#result').textContent = JSON.stringify(out);
</script>
</html>
