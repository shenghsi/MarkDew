<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Settings font check</title>
<div id="app"></div>
<pre id="result">running</pre>
<script type="module">
import '/src/web/main.ts';
import { showSettingsDialog } from '/src/web/settings.ts';
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
await wait(800);
const size = () => getComputedStyle(document.querySelector('#editor .cm-editor')).fontSize;
const family = () => getComputedStyle(document.querySelector('#editor .cm-content')).fontFamily;
const out = {before: size(), family: family()};
showSettingsDialog(); await wait(200);
document.querySelector('#tab-appearance')?.click(); await wait(200);
const select = document.querySelector('select[data-key="markdew.writing-size"]');
out.hasWritingSize = !!select;
if (select) { select.value = '150'; select.dispatchEvent(new Event('change', {bubbles: true})); await wait(300); }
out.after = size(); out.header = document.querySelector('.writing-size-control select').value; out.scaleVar = document.documentElement.style.getPropertyValue('--writing-scale');
out.selects = Array.from(document.querySelectorAll('.settings-modal select')).map(s => s.dataset.key);
out.fontInputs = Array.from(document.querySelectorAll('.settings-modal input, .settings-modal select')).filter(e => /font/i.test(e.dataset.key || e.name || e.id || '')).map(e => e.dataset.key);
const fontSelect = document.querySelector('select[data-key="markdew.writing-font"]');
out.hasFontSelect = !!fontSelect;
if (fontSelect) {
  const option = new Option('DejaVu Sans', 'DejaVu Sans'); fontSelect.add(option); fontSelect.value = 'DejaVu Sans'; fontSelect.dispatchEvent(new Event('change', {bubbles: true})); await wait(300);
  out.familyAfter = family();
}
const codeSelect = document.querySelector('select[data-key="markdew.code-font"]');
if (codeSelect) { codeSelect.add(new Option('DejaVu Sans Mono', 'DejaVu Sans Mono')); codeSelect.value = 'DejaVu Sans Mono'; codeSelect.dispatchEvent(new Event('change', {bubbles: true})); await wait(200); out.codeVar = document.documentElement.style.getPropertyValue('--code-font'); }
out.ok = out.after === '25.5px' && out.header === '150' && /^"DejaVu Sans",/.test(out.familyAfter || '') && /^"DejaVu Sans Mono"/.test(out.codeVar || '');
document.querySelector('#result').textContent = JSON.stringify(out);
</script>
</html>
